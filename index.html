<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d10">

<title>Sports TV</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0d10;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 24px 16px 50px;
}

h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 800;
}

.date {
    color: #9299a4;
    margin-top: 5px;
    margin-bottom: 20px;
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}

.tabs button {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 12px;
    background: #242932;
    color: white;
    font-size: 16px;
    font-weight: 700;
}

.tabs button.active {
    background: white;
    color: #111318;
}

.next {
    background: #171b21;
    border: 1px solid #2b313a;
    border-radius: 17px;
    padding: 17px;
    margin-bottom: 26px;
}

.next-label {
    font-size: 12px;
    color: #9299a4;
    font-weight: 800;
    letter-spacing: 1px;
}

.next-game {
    font-size: 20px;
    font-weight: 800;
    margin-top: 7px;
}

section {
    margin-bottom: 25px;
}

.section-title {
    font-size: 21px;
    font-weight: 800;
    margin-bottom: 9px;
}

.game {
    background: #15181d;
    border-radius: 13px;
    padding: 14px;
    margin-bottom: 7px;
    display: grid;
    grid-template-columns: 70px 1fr auto;
    gap: 10px;
    align-items: center;
}

.time {
    font-weight: 800;
}

.event {
    font-weight: 700;
}

.channel {
    color: #aab1bb;
    font-size: 13px;
    text-align: right;
}

.empty {
    color: #858d98;
    font-size: 14px;
    padding: 5px 2px;
}

.footer {
    color: #666e79;
    font-size: 12px;
    text-align: center;
    margin-top: 30px;
}
</style>
</head>

<body>

<div class="container">

<h1>Sports TV</h1>

<div class="date" id="date"></div>

<div class="tabs">
    <button id="todayBtn" class="active">Today</button>
    <button id="tomorrowBtn">Tomorrow</button>
</div>

<div class="next">
    <div class="next-label">NEXT UP</div>
    <div class="next-game" id="nextGame">
        Loading…
    </div>
</div>

<div id="sports"></div>

<div class="footer">
    Eastern Time • Scores intentionally hidden
</div>

</div>

<script>

const WORKER_URL =
"https://bro-sports-tv.brosiusflooring.workers.dev";

const categories = [
    ["nhl", "🏒 NHL"],
    ["hockey", "🏒 Hockey"],
    ["nfl", "🏈 NFL"],
    ["collegeFootball", "🏈 College Football"],
    ["mlbPostseason", "⚾ MLB Postseason"],
    ["nascar", "🏎️ NASCAR"]
];

let selectedDay = 0;

function getDate(offset) {

    const date = new Date();

    date.setDate(date.getDate() + offset);

    return date.toLocaleDateString("en-CA", {
        timeZone: "America/New_York"
    });
}

function updateDate() {

    const date = new Date();

    date.setDate(date.getDate() + selectedDay);

    document.getElementById("date").textContent =
        date.toLocaleDateString("en-US", {
            weekday: "long",
            month: "long",
            day: "numeric",
            timeZone: "America/New_York"
        });
}

function showGame(game) {

    return `
        <div class="game">

            <div class="time">
                ${game.time || ""}
            </div>

            <div class="event">
                ${game.event || ""}
            </div>

            <div class="channel">
                ${game.channel || "TV info unavailable"}
            </div>

        </div>
    `;
}

function renderCategory(title, games) {

    if (!games || games.length === 0) {

        return `
            <section>

                <div class="section-title">
                    ${title}
                </div>

                <div class="empty">
                    Nothing scheduled.
                </div>

            </section>
        `;
    }

    return `
        <section>

            <div class="section-title">
                ${title}
            </div>

            ${games.map(showGame).join("")}

        </section>
    `;
}

async function loadSports() {

    const container =
        document.getElementById("sports");

    const next =
        document.getElementById("nextGame");

    container.innerHTML =
        `<div class="empty">Loading today's sports…</div>`;

    next.textContent =
        "Checking the schedule…";

    try {

        const date =
            getDate(selectedDay);

        const response =
            await fetch(
                `${WORKER_URL}?date=${date}`
            );

        if (!response.ok) {
            throw new Error("Worker unavailable");
        }

        const data =
            await response.json();

        if (data.status !== "ok") {
            throw new Error("Schedule unavailable");
        }

        let html = "";

        categories.forEach(category => {

            const key = category[0];
            const title = category[1];

            html += renderCategory(
                title,
                data.sports[key]
            );

        });

        container.innerHTML = html;

        if (data.nextUp) {

            next.textContent =
                `${data.nextUp.event} • ${data.nextUp.time}`;

        } else {

            next.textContent =
                "Nothing scheduled.";

        }

    } catch (error) {

        container.innerHTML = `
            <div class="empty">
                Unable to load the sports schedule.
            </div>
        `;

        next.textContent =
            "Schedule temporarily unavailable.";
    }
}

document.getElementById("todayBtn").onclick =
function() {

    selectedDay = 0;

    this.classList.add("active");

    document
        .getElementById("tomorrowBtn")
        .classList.remove("active");

    updateDate();
    loadSports();
};

document.getElementById("tomorrowBtn").onclick =
function() {

    selectedDay = 1;

    this.classList.add("active");

    document
        .getElementById("todayBtn")
        .classList.remove("active");

    updateDate();
    loadSports();
};

updateDate();
loadSports();

</script>

</body>
</html>
